name: Release bridge.wasm

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable + wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry + aidoku-cli
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/aidoku
          key: aidoku-cli-${{ runner.os }}-1

      - name: Install aidoku-cli
        run: |
          if ! command -v aidoku >/dev/null; then
            cargo install --git https://github.com/Aidoku/aidoku-rs aidoku-cli
          fi

      - name: Package + verify
        run: |
          aidoku package .
          aidoku verify package.aix

      - name: Extract bridge.wasm
        run: |
          rm -rf dist && mkdir dist
          python3 -c "import zipfile; z=zipfile.ZipFile('package.aix'); open('dist/bridge.wasm','wb').write(z.read('Payload/main.wasm'))"
          cp package.aix dist/template.aix
          sha256sum dist/* | tee dist/CHECKSUMS.txt

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/bridge.wasm
            dist/template.aix
            dist/CHECKSUMS.txt
